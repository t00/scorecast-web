<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ed0ff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <radialGradient id="ballG" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e8f1ff"/>
      <stop offset="100%" stop-color="#8ea7c9"/>
    </radialGradient>
  </defs>

  <g transform="translate(256 256)">
    <circle r="100" fill="none" stroke="url(#accentV)" stroke-width="10" opacity="0.2"/>
    <circle r="150" fill="none" stroke="url(#accentV)" stroke-width="8"  opacity="0.15"/>
    <circle r="200" fill="none" stroke="url(#accentV)" stroke-width="6"  opacity="0.12"/>

    <circle r="100" fill="none" stroke="url(#accentV)" stroke-width="10">
      <animate attributeName="opacity"
               values="0.95;0.2;0.2;0.2"
               keyTimes="0;0.33;0.66;1"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="150" fill="none" stroke="url(#accentV)" stroke-width="8">
      <animate attributeName="opacity"
               values="0.15;0.85;0.15;0.15"
               keyTimes="0;0.33;0.66;1"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="none" stroke="url(#accentV)" stroke-width="6">
      <animate attributeName="opacity"
               values="0.12;0.12;0.65;0.12"
               keyTimes="0;0.33;0.66;1"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="256" cy="256" r="44" fill="url(#ballG)" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
  <circle cx="242" cy="242" r="12" fill="#ffffff" opacity="0.9"/>
</svg>
